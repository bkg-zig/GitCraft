[package]
name = "gc"
version = "0.1.0"
edition = "2024"
description = "GitCraft: native coding-agent orchestration, AST review, and code context."
license = "MIT"
default-run = "gc-web"

[[bin]]
name = "gc-web"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "gc"
path = "src/bin/gc.rs"

[[bin]]
name = "gc-proxy"
path = "src/bin/gc-proxy.rs"

[features]
default = ["server", "cli", "acp"]
server = ["dioxus/server", "dioxus/fullstack", "dep:dioxus-server", "dep:axum"]
web = ["dioxus/web", "dioxus/fullstack"]
cli = ["dep:ratatui", "dep:crossterm"]
acp = ["dep:agent-client-protocol", "dep:blocking"]

[dependencies]
agent-client-protocol = { version = "2.0.0", optional = true }
anyhow = "1.0"
axum = { version = "0.8.9", optional = true }
blocking = { version = "1.6", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "fullstack"] }
dioxus-server = { version = "0.7.10", optional = true }
dirs = "6.0"
futures-util = "0.3"
git2 = { version = "0.20.4", default-features = false }
ratatui = { version = "0.30", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.49", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
sha2 = "0.11"


[dev-dependencies]
tempfile = "3.27"
